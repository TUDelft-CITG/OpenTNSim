[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# No dirty states, otherwise we also get them in the book 
# The book first runs calculations and then the notebooks are updated.
version_scheme = "only-version"


[tool.poetry]
package-mode = false

[project]
name = "opentnsim"
dynamic = ["version"]
description = "The OpenTNSim package aims to facilitate the analysis of network performance for different network configurations, fleet compositions and traffic rules."
authors = [
    { name = "Mark van Koningsveld", email = "m.vankoningsveld@tudelft.nl" },
]

license = "MIT"
readme = "README.md"
homepage = "https://github.com/TUDelft-CITG/OpenTNSim"
keywords = ["OpenTNSim", "simulation", "transport", "OpenCLSim"]


classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
# set python version
requires-python = ">=3.12, <4"

dependencies = [
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "sphinx>=9.1.1",
    "deprecated>=3.0.1",
    "networkx>=3.7",
    "simpy>=4.1.2",
    "openclsim>=1.6.3",
    "scipy>=1.18.1",
    "requests-cache>=1.3.3",
    "simplekml>=1.3.6",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "click>=8.5.1",
    "pyyaml>=6.0.3",
    "pytz>=2026.6",
]

# Extras 
[project.optional-dependencies]
testing = [
    "pytest>=9.2.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "colorcet>=3.2.1",
    "cython>=3.3.1",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "ipyleaflet>=0.20.0",
    "ipywidgets>=8.1.9",
    "jsonschema>=4.26.0",
    # jupyter book 2 needs testing (and node installed)
    "jupyter-book>=2.1.7",
    "jupyterlab-widgets>=3.0.17",
    "momepy>=1.0.0",
    "nbconvert>=7.17.2",
    "nbmake>=1.5.5",
    "notebook>=7.6.5",
    "openpyxl>=3.1.5",
    "pytest-datadir>=1.9.0",
    "pyyaml>=6.0.3",
    "sphinx-rtd-theme>=3.1.0",
    "movingpandas[smooting,viz]>=0.23.0",
    "lonboard>=0.17.0",
    "pyarrow>=26.0.1",
    "anywidget>=0.11.0",
    "mapclassify>=2.11.0",
]

[project.scripts]
opentnsim = "opentnsim.cli:cli"

[project.urls]
Homepage = "https://github.com/TUDelft-CITG/OpenTNSim"

[tool.hatch.build.targets.sdist]
include = [
    "/opentnsim",
]

[tool.black]
line-length = 132

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov --cov-report term-missing --cov-report html --verbose"

norecursedirs = [
    "dist",
    "build",
    ".tox",
    ".eggs"
]
testpaths = "tests"

# depdencies for development (e.g. specific jupyter kernel)
[dependency-groups]
dev = [
    "black[jupyter]>=26.10.1",
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "nbformat>=5.11.1",
]

